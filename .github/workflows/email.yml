name: Test_Email_Sender

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  autoEmail:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Singapore"
      - run: node automation/auto.js